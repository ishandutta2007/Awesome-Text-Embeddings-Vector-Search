<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Text Linear Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="badgeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="badgeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="badgeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Background Ambient Glows -->
  <circle cx="600" cy="210" r="450" fill="url(#centerGlow)" />
  <circle cx="150" cy="100" r="280" fill="url(#purpleGlow)" />
  <circle cx="1050" cy="320" r="280" fill="url(#cyanGlow)" />

  <!-- Decorative Technical Grid Overlay -->
  <g stroke="#334155" stroke-opacity="0.18" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="250" y1="0" x2="250" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="550" y1="0" x2="550" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="850" y1="0" x2="850" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="1150" y1="0" x2="1150" y2="420" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- Dynamic Vector Graph & Search Trajectories (Behind Text) -->
  <g opacity="0.65">
    <!-- Graph Edges / Vectors with animated dash offsets -->
    <line x1="120" y1="80" x2="240" y2="150" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6,4">
      <animate attributeName="stroke-dashoffset" from="30" to="0" dur="3s" repeatCount="indefinite" />
    </line>
    <line x1="240" y1="150" x2="160" y2="320" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="30" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="160" y1="320" x2="280" y2="360" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6,3">
      <animate attributeName="stroke-dashoffset" from="36" to="0" dur="4.5s" repeatCount="indefinite" />
    </line>
    <line x1="940" y1="100" x2="1080" y2="160" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4">
      <animate attributeName="stroke-dashoffset" from="40" to="0" dur="3.5s" repeatCount="indefinite" />
    </line>
    <line x1="1080" y1="160" x2="1020" y2="320" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="5,5">
      <animate attributeName="stroke-dashoffset" from="0" to="30" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="1020" y1="320" x2="1140" y2="350" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" from="28" to="0" dur="3s" repeatCount="indefinite" />
    </line>

    <!-- Radar Pulse Ring for Query Node (Left side) -->
    <circle cx="120" cy="80" r="10" fill="none" stroke="#818cf8" stroke-width="2">
      <animate attributeName="r" values="6;48" dur="3.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="120" cy="80" r="5" fill="#a5b4fc" filter="url(#nodeGlow)" />

    <!-- Radar Pulse Ring for Vector Cluster (Right side) -->
    <circle cx="1080" cy="160" r="10" fill="none" stroke="#38bdf8" stroke-width="2">
      <animate attributeName="r" values="6;52" dur="3.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0" dur="3.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1080" cy="160" r="6" fill="#38bdf8" filter="url(#nodeGlow)" />

    <!-- Minor Animated Embedding Points -->
    <circle cx="240" cy="150" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="160" cy="320" r="5" fill="#818cf8">
      <animate attributeName="r" values="4;6;4" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="280" cy="360" r="3.5" fill="#c084fc">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="940" cy="100" r="4" fill="#c084fc">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="320" r="5" fill="#818cf8">
      <animate attributeName="r" values="4;6.5;4" dur="3.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="1140" cy="350" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Side Floating Metric Badges (Far Left & Right Margins - Kept away from center text) -->
  <!-- Left Side Badges -->
  <g transform="translate(60, 220)">
    <animateTransform attributeName="transform" type="translate" values="60,220; 60,214; 60,220" dur="5s" repeatCount="indefinite" />
    <rect width="180" height="34" rx="17" fill="url(#badgeGrad1)" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.6" filter="url(#shadow)" />
    <circle cx="18" cy="17" r="5" fill="#818cf8" />
    <text x="32" y="22" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">DENSE &amp; SPARSE</text>
  </g>

  <g transform="translate(50, 275)">
    <animateTransform attributeName="transform" type="translate" values="50,275; 50,281; 50,275" dur="6s" repeatCount="indefinite" />
    <rect width="195" height="34" rx="17" fill="url(#badgeGrad2)" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.6" filter="url(#shadow)" />
    <circle cx="18" cy="17" r="5" fill="#22d3ee" />
    <text x="32" y="22" fill="#a5f3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">COSINE SIMILARITY</text>
  </g>

  <!-- Right Side Badges -->
  <g transform="translate(950, 220)">
    <animateTransform attributeName="transform" type="translate" values="950,220; 950,214; 950,220" dur="5.5s" repeatCount="indefinite" />
    <rect width="190" height="34" rx="17" fill="url(#badgeGrad3)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" filter="url(#shadow)" />
    <circle cx="18" cy="17" r="5" fill="#e879f9" />
    <text x="32" y="22" fill="#f5d0fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">HNSW / IVF INDEX</text>
  </g>

  <g transform="translate(960, 275)">
    <animateTransform attributeName="transform" type="translate" values="960,275; 960,281; 960,275" dur="6.2s" repeatCount="indefinite" />
    <rect width="180" height="34" rx="17" fill="url(#badgeGrad1)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#shadow)" />
    <circle cx="18" cy="17" r="5" fill="#38bdf8" />
    <text x="32" y="22" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">MTEB BENCHMARKS</text>
  </g>

  <!-- Foreground Center Content Shield (Ensures 100% legibility and foreground priority) -->
  <g>
    <!-- Top Category Pill -->
    <g transform="translate(460, 55)">
      <rect width="280" height="30" rx="15" fill="#1e1b4b" fill-opacity="0.85" stroke="#4f46e5" stroke-width="1.2" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8" />
      <text x="28" y="20" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title (Strictly Foreground, Crisp Typography) -->
    <text x="600" y="165" text-anchor="middle" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#textShadow)">
      Text Embeddings &amp; Vector Search
    </text>

    <!-- Subtitle (Clear, readable, high contrast) -->
    <text x="600" y="215" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" letter-spacing="0.2" filter="url(#textShadow)">
      The Definitive Guide to Embedding Models, Vector Databases &amp; Semantic Retrieval
    </text>

    <!-- Description Line -->
    <text x="600" y="250" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0.3">
      Multilingual Dense Representations • Hybrid Lexical Search • High-Throughput ANN Engines • RAG Architecture
    </text>

    <!-- Center Feature Badges Flow -->
    <g transform="translate(305, 290)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text x="90" y="20" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ 100+ Model Families</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(195, 0)">
        <rect width="200" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text x="100" y="20" text-anchor="middle" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🧠 8192 Token Context</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(410, 0)">
        <rect width="180" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text x="90" y="20" text-anchor="middle" fill="#22c55e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🚀 Production Ready</text>
      </g>
    </g>

    <!-- Bottom Status Bar Accent -->
    <line x1="450" y1="365" x2="750" y2="365" stroke="url(#textGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
